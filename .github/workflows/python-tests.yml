name: Python tests
on:
  push:
    paths:
      - "projects/**"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "projects/**"
      - ".github/workflows/python-tests.yml"
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test ticket tracker
        run: python -m unittest discover -s projects/helpdesk-ticket-cli/tests -v
      - name: Test log analyzer
        run: python -m unittest discover -s projects/log-analyzer/tests -v
