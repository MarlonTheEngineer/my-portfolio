name: Portfolio quality checks

on:
  push:
    paths:
      - "docs/**"
      - "projects/**"
      - "scripts/**"
      - "README.md"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "docs/**"
      - "projects/**"
      - "scripts/**"
      - "README.md"
      - ".github/workflows/python-tests.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate website
        run: python scripts/check_site.py
      - name: Test helpdesk ticket tracker
        run: python -m unittest discover -s projects/helpdesk-ticket-cli/tests -v
      - name: Test log analyzer
        run: python -m unittest discover -s projects/log-analyzer/tests -v
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test neural network engine
        run: node --test docs/neural-network/tests.js
