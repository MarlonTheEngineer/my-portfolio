name: Portfolio Post-Deploy Smoke

on:
  # GitHub Pages currently runs its own branch-based deployment.
  # Check the public routes after a successful Pages build, and weekly as a fallback.
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "11 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-post-deploy
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Verify production GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published-site verification script
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check public portfolio pages over HTTPS
        run: |
          python projects/ci-cd-pipeline/pipeline.py smoke \
            --url https://marlontheengineer.github.io/my-portfolio/ \
            --attempts 6

      - name: Show deployment summary
        run: |
          echo "Verified portfolio, neural-network, helpdesk-copilot, and pipeline pages."
          echo "Hosting: native GitHub Pages (main/docs)."
